<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEAP University — Micro 101 RTE</title>
<style>
  :root{
    --maroon:#8B1E2D;
    --maroon-dk:#6E1724;
    --gold:#C5A059;
    --amber:#B5750C;
    --ink:#1A1A1A;
    --slate:#475569;
    --cream:#F7F2EC;
    --cream2:#EDE4D8;
    --white:#FFFFFF;
    --green:#2F6F4E;
    --red:#B3261E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: var(--ink);
    min-height:100vh;
  }
  .sans{ font-family: -apple-system, Segoe UI, Calibri, Helvetica, Arial, sans-serif; }
  #app{ max-width:880px; margin:0 auto; padding:0 20px 60px; }

  /* Header */
  .course-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0 16px; border-bottom:2px solid var(--maroon);
    margin-bottom:0;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .crest{
    width:40px; height:40px; border-radius:50%; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .crest img{ width:100%; height:100%; object-fit:contain; }
  .brand-text .eyebrow{ font-family: Georgia, serif; font-size:11px; letter-spacing:1.5px; color:var(--maroon); font-weight:bold; }
  .brand-text .course-code{ font-size:13px; color:var(--slate); font-family: -apple-system,Segoe UI,Calibri,sans-serif;}
  .duration-pill{
    font-family: -apple-system,Segoe UI,Calibri,sans-serif; font-size:12.5px; color:var(--maroon-dk);
    background:var(--cream2); border-radius:20px; padding:6px 14px; white-space:nowrap;
  }

  /* Progress bar */
  .progress-track{ height:6px; background:var(--cream2); border-radius:4px; margin:18px 0 30px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--maroon); border-radius:4px; transition:width .35s ease; }
  .progress-label{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:12px; color:var(--slate); margin-top:6px; text-align:right;}

  /* Card */
  .card{
    background:var(--white); border:1px solid var(--cream2); border-radius:6px;
    padding:44px 48px; min-height:420px; display:flex; flex-direction:column;
    box-shadow: 0 2px 14px rgba(0,0,0,0.04);
  }
  @media (max-width:640px){ .card{ padding:28px 22px; } }

  .kicker{ font-family: -apple-system,Segoe UI,Calibri,sans-serif; font-size:12.5px; letter-spacing:1px; color:var(--maroon); font-weight:700; margin-bottom:10px;}
  h1.slide-title{ font-size:28px; margin:0 0 18px; line-height:1.25; }
  h2.slide-title{ font-size:23px; margin:0 0 16px; line-height:1.3; }
  .body-text{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:16px; line-height:1.65; color:var(--slate); }
  .body-text p{ margin:0 0 14px; }

  ul.obj-list{ list-style:none; margin:0; padding:0; font-family:-apple-system,Segoe UI,Calibri,sans-serif;}
  ul.obj-list li{ position:relative; padding-left:28px; margin-bottom:12px; font-size:15.5px; color:var(--ink); line-height:1.5;}
  ul.obj-list li:before{ content:"\2713"; position:absolute; left:0; top:1px; color:var(--maroon); font-weight:bold;}

  .points{ list-style:none; margin:0; padding:0; font-family:-apple-system,Segoe UI,Calibri,sans-serif;}
  .points li{ position:relative; padding-left:22px; margin-bottom:14px; font-size:15.5px; color:var(--ink); line-height:1.55;}
  .points li:before{ content:""; position:absolute; left:0; top:8px; width:7px; height:7px; background:var(--gold); border-radius:50%;}

  .callout{ background:var(--cream); border-left:3px solid var(--gold); padding:14px 18px; margin:18px 0; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px; color:var(--maroon-dk); border-radius:0 4px 4px 0;}

  .module-tag{ display:inline-block; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:0.5px; color:var(--white); background:var(--maroon); padding:4px 10px; border-radius:3px; margin-bottom:14px;}

  /* Knowledge check / assessment */
  .kc-badge{ display:inline-flex; align-items:center; gap:8px; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:0.5px; color:var(--maroon-dk); background:var(--cream2); padding:5px 12px; border-radius:3px; margin-bottom:16px;}
  .kc-question{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:17px; font-weight:600; color:var(--ink); margin-bottom:20px; line-height:1.5;}
  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
  .option{
    font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:15px; text-align:left;
    padding:13px 16px; border:1.5px solid var(--cream2); border-radius:6px; background:var(--white);
    cursor:pointer; transition: border-color .15s, background .15s; color:var(--ink);
    display:flex; align-items:center; gap:12px;
  }
  .option:hover{ border-color:var(--gold); background:var(--cream); }
  .option .letter{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--slate); display:flex; align-items:center; justify-content:center; font-size:12px; flex:none; color:var(--slate); }
  .option.selected{ border-color:var(--maroon); background:var(--cream); }
  .option.selected .letter{ border-color:var(--maroon); background:var(--maroon); color:var(--white); }
  .option.correct{ border-color:var(--green); background:#EAF4EE; }
  .option.correct .letter{ background:var(--green); border-color:var(--green); color:var(--white); }
  .option.incorrect{ border-color:var(--red); background:#FBEAE9; }
  .option.incorrect .letter{ background:var(--red); border-color:var(--red); color:var(--white); }
  .option:disabled, .option.locked{ cursor:default; }

  .feedback{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px; padding:14px 16px; border-radius:6px; margin-bottom:8px; line-height:1.55; display:none;}
  .feedback.show{ display:block; }
  .feedback.correct-fb{ background:#EAF4EE; color:#20573B; border:1px solid #BEE0CC; }
  .feedback.incorrect-fb{ background:#FBEAE9; color:#8A2A24; border:1px solid #F0C4C1; }
  .feedback b{ display:block; margin-bottom:3px; }

  /* Footer nav */
  .card-footer{ margin-top:auto; padding-top:28px; display:flex; align-items:center; justify-content:space-between; }
  .btn{
    font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px; font-weight:600;
    padding:12px 26px; border-radius:5px; border:none; cursor:pointer; transition: opacity .15s, transform .1s;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background:var(--maroon); color:var(--white); }
  .btn-primary:hover{ background:var(--maroon-dk); }
  .btn-primary:disabled{ background:#C9BCB0; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--slate); padding:12px 8px; }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-ghost:disabled{ visibility:hidden; }

  /* Landing / result / summary */
  .landing-icon, .complete-icon{ width:64px; height:64px; border-radius:50%; border:2px solid var(--maroon); display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--maroon); margin-bottom:22px;}
  .complete-icon{ border-color:var(--green); color:var(--green); }
  .meta-row{ display:flex; gap:26px; flex-wrap:wrap; margin:22px 0 6px; font-family:-apple-system,Segoe UI,Calibri,sans-serif;}
  .meta-item .meta-label{ font-size:11px; letter-spacing:0.5px; color:var(--slate); font-weight:700; margin-bottom:3px;}
  .meta-item .meta-value{ font-size:14.5px; color:var(--ink); }

  .score-box{ display:flex; gap:36px; margin:22px 0; flex-wrap:wrap; }
  .score-num{ font-family:Georgia,serif; font-size:40px; color:var(--maroon); font-weight:bold; }
  .score-label{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:13px; color:var(--slate); }

  /* Feedback survey */
  .survey-meta{ width:100%; border-collapse:collapse; margin:20px 0 30px; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14px; }
  .survey-meta td{ border:1px solid var(--cream2); padding:10px 14px; }
  .survey-meta td.label{ background:var(--cream); font-weight:700; width:36%; color:var(--ink); }
  .survey-meta td.value{ color:var(--slate); }
  .survey-q{ margin-bottom: 26px; }
  .survey-q-text{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:15.5px; font-weight:700; color:var(--ink); margin-bottom:10px; }
  .survey-scale{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:13px; color:var(--slate); }
  .survey-scale .end-label{ font-style:italic; min-width:96px; }
  .survey-scale .end-label.right{ text-align:left; }
  .survey-dot{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--cream2); background:var(--white);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--slate); cursor:pointer;
    font-family:-apple-system,Segoe UI,Calibri,sans-serif; transition: all .15s;
  }
  .survey-dot:hover{ border-color:var(--gold); }
  .survey-dot.selected{ background:var(--maroon); border-color:var(--maroon); color:var(--white); font-weight:700; }
  .survey-textarea{
    width:100%; min-height:90px; border:1.5px solid var(--cream2); border-radius:6px; padding:12px 14px;
    font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px; color:var(--ink); resize:vertical;
  }
  .survey-textarea:focus{ outline:none; border-color:var(--gold); }

  .assess-note{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14px; color:var(--slate); background:var(--cream); border-radius:6px; padding:12px 16px; margin:4px 0 20px;}

  /* Illustrations (inline SVG, no external requests) */
  .hero-fig{ margin:-44px -48px 22px; background:linear-gradient(135deg,#F5EAE3,#EDE0D2); display:flex; align-items:center; justify-content:center; }
  .hero-fig svg{ width:100%; height:230px; display:block; }
  @media (max-width:640px){ .hero-fig{ margin:-28px -22px 18px; } .hero-fig svg{ height:170px; } }
  .module-fig{ margin:6px 0 20px; border-radius:8px; overflow:hidden; background:#F7F2EC; display:flex; align-items:center; justify-content:center; }
  .module-fig svg{ width:100%; height:190px; display:block; }
</style>
</head>

<script>
const COURSE = {"heroSvg": "<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(300,150)\"><circle cx=\"-180\" cy=\"-70\" r=\"70\" fill=\"#C5A059\" opacity=\"0.12\"/>\n    <circle cx=\"200\" cy=\"60\" r=\"90\" fill=\"#8B1E2D\" opacity=\"0.08\"/>\n    <circle cx=\"150\" cy=\"-90\" r=\"34\" fill=\"#C5A059\" opacity=\"0.18\"/>\n<circle cx=\"0\" cy=\"0\" r=\"95\" fill=\"#EDE4D8\" stroke=\"#475569\" stroke-width=\"2\" opacity=\"0.5\"/>\n<circle cx=\"0\" cy=\"0\" r=\"70\" fill=\"#FFFFFF\" stroke=\"#475569\" stroke-width=\"2.5\"/>\n<circle cx=\"0\" cy=\"0\" r=\"45\" fill=\"#C5A059\" opacity=\"0.35\" stroke=\"#B5750C\" stroke-width=\"2.5\"/>\n<circle cx=\"0\" cy=\"0\" r=\"20\" fill=\"#8B1E2D\"/>\n<text x=\"0\" y=\"4\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"11\" fill=\"#FFFFFF\" font-weight=\"700\">Z1</text>\n</g></svg>", "courseCode": "Micro 101 \u2013 RTE", "courseTitle": "RTE Environmental Monitoring & Listeria Control", "college": "COLLEGE OF FOOD SAFETY", "employeeType": "Salary (RTE / prepared-product track)", "format": "Workday, self-paced", "prerequisites": "Micro 101 complete", "estDuration": "5\u20136 min", "leadsTo": "FS 201 \u2014 Root Cause Analysis Fundamentals", "description": "Micro 101 \u2013 RTE goes deeper on the microbiology that's unique to ready-to-eat product: why RTE carries a different risk profile than raw, why Listeria monocytogenes is uniquely hard to control, how environmental monitoring programs (EMPs) are zoned, and what happens when a swab comes back positive.", "objectives": ["Explain why ready-to-eat (RTE) product carries a different microbiological risk profile than raw product.", "Describe why Listeria monocytogenes is uniquely difficult to control in RTE environments.", "Identify the four zones of an environmental monitoring program (EMP) and what each one covers.", "Describe what typically happens when an environmental swab returns a positive result."], "modules": [{"title": "Why RTE Is Different", "points": ["RTE product is fully cooked and ready to eat, with no further kill step before it reaches the consumer \u2014 any contamination that happens after packaging goes straight to the customer.", "That's exactly why Listeria monocytogenes is legally an adulterant in RTE product specifically: it's the pathogen most associated with contamination that happens in the plant environment after the kill step, not from the raw ingredient itself.", "Raw product typically gets a cook step downstream, at a restaurant or in someone's kitchen. RTE doesn't \u2014 so the plant's own environment becomes the last line of defense against contamination."], "callout": "No kill step after RTE packaging means the plant environment IS the food safety control \u2014 that's the whole reason environmental monitoring exists.", "kcs": [{"question": "Why does RTE product require a different level of environmental control than raw product?", "options": ["There's no kill step after packaging, so plant-environment contamination goes straight to the consumer", "RTE product is inspected more often by USDA", "RTE product doesn't require any inspection", "Raw product is more dangerous, so RTE gets less scrutiny"], "correctIndex": 0, "explanation": " Because nothing cooks RTE product again before the consumer eats it, any contamination picked up in the plant environment after the kill step reaches the customer directly \u2014 that's the core reason RTE gets stricter environmental controls."}, {"question": "Why is Listeria monocytogenes specifically an adulterant in RTE product?", "options": ["It's the pathogen most associated with post-lethality environmental contamination", "It's the only pathogen that can survive cooking", "It only affects raw product, not RTE", "It's not actually a concern in RTE facilities"], "correctIndex": 0, "explanation": " Listeria monocytogenes is closely tied to contamination that happens in the plant environment after the kill step \u2014 exactly the risk that makes RTE product different from raw."}]}, {"title": "Listeria monocytogenes: The RTE Problem", "points": ["Listeria monocytogenes grows at refrigeration temperatures \u2014 unlike most foodborne pathogens, the cold doesn't stop it from multiplying.", "It can colonize drains, equipment crevices, and other hard-to-clean spots for months or even years if it isn't found and eliminated.", "It also tolerates common cleaning chemicals better than most pathogens, which is a big part of why it's so persistent once it establishes itself in a facility."], "svg": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(200,110)\"><circle cx=\"0\" cy=\"0\" r=\"88\" fill=\"#EDE4D8\" opacity=\"0.6\"/>\n<circle cx=\"-40\" cy=\"0\" r=\"55\" fill=\"#FFFFFF\" stroke=\"#475569\" stroke-width=\"3\"/>\n<line x1=\"-40\" y1=\"-35\" x2=\"-40\" y2=\"35\" stroke=\"#475569\" stroke-width=\"3\"/>\n<line x1=\"-70\" y1=\"-17\" x2=\"-10\" y2=\"17\" stroke=\"#475569\" stroke-width=\"3\"/>\n<line x1=\"-70\" y1=\"17\" x2=\"-10\" y2=\"-17\" stroke=\"#475569\" stroke-width=\"3\"/>\n<circle cx=\"55\" cy=\"0\" r=\"42\" fill=\"#8B1E2D\" opacity=\"0.15\"/>\n<ellipse cx=\"55\" cy=\"0\" rx=\"26\" ry=\"14\" fill=\"#8B1E2D\"/>\n<circle cx=\"70\" cy=\"-3\" r=\"3\" fill=\"#FFFFFF\"/>\n</g></svg>", "kcs": [{"question": "What makes Listeria monocytogenes uniquely dangerous in a refrigerated RTE environment?", "options": ["It keeps growing at refrigeration temperatures, unlike most foodborne pathogens", "It can't survive outside the human body", "It's destroyed by normal refrigeration", "It only grows above room temperature"], "correctIndex": 0, "explanation": " Most foodborne pathogens slow down or stop growing in the cold \u2014 Listeria monocytogenes doesn't, which is exactly why refrigerated RTE product needs such careful environmental control."}, {"question": "Once established in a facility, how persistent can Listeria monocytogenes be?", "options": ["It can colonize drains and equipment crevices for months or years if not eliminated", "It naturally dies off within a day or two", "It only survives a single production shift", "It can't survive on equipment surfaces at all"], "correctIndex": 0, "explanation": " Listeria monocytogenes is known for long-term persistence in hard-to-clean spots like drains and equipment crevices \u2014 sometimes for months or years \u2014 which is why ongoing environmental monitoring matters."}]}, {"title": "The Four EMP Zones", "points": ["Zone 1: direct food-contact surfaces \u2014 conveyor belts, slicer blades, filler nozzles. This is the highest-scrutiny zone; a positive here can mean a product hold.", "Zone 2: non-food-contact surfaces immediately adjacent to product \u2014 equipment housings, frames, supports.", "Zone 3: non-food-contact surfaces elsewhere in the production area \u2014 floors, drains, walls.", "Zone 4: non-production areas \u2014 hallways, break rooms, loading docks.", "Many EMPs sample \u201coutside-in\u201d \u2014 watching Zones 2 through 4 closely to catch Listeria before it ever has a chance to reach Zone 1 and the product itself."], "svg": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(200,110)\"><circle cx=\"0\" cy=\"0\" r=\"88\" fill=\"#EDE4D8\" opacity=\"0.6\"/>\n<circle cx=\"0\" cy=\"0\" r=\"90\" fill=\"#FFFFFF\" stroke=\"#475569\" stroke-width=\"2.5\"/>\n<text x=\"0\" y=\"-72\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"11\" fill=\"#475569\" font-weight=\"700\">ZONE 4</text>\n<circle cx=\"0\" cy=\"0\" r=\"65\" fill=\"#F7F2EC\" stroke=\"#475569\" stroke-width=\"2.5\"/>\n<text x=\"0\" y=\"-47\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"11\" fill=\"#475569\" font-weight=\"700\">ZONE 3</text>\n<circle cx=\"0\" cy=\"0\" r=\"42\" fill=\"#C5A059\" opacity=\"0.4\" stroke=\"#B5750C\" stroke-width=\"2.5\"/>\n<text x=\"0\" y=\"-24\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"10.5\" fill=\"#1A1A1A\" font-weight=\"700\">ZONE 2</text>\n<circle cx=\"0\" cy=\"0\" r=\"20\" fill=\"#8B1E2D\"/>\n<text x=\"0\" y=\"4\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"10.5\" fill=\"#FFFFFF\" font-weight=\"700\">ZONE 1</text>\n</g></svg>", "kcs": [{"question": "Which zone covers direct food-contact surfaces like conveyor belts and slicer blades?", "options": ["Zone 1", "Zone 2", "Zone 3", "Zone 4"], "correctIndex": 0, "explanation": " Zone 1 is direct food-contact surfaces \u2014 the highest-scrutiny zone, since anything found there has direct access to the product."}, {"question": "Which zone covers non-production areas like hallways and break rooms?", "options": ["Zone 4", "Zone 1", "Zone 2", "Zone 3"], "correctIndex": 0, "explanation": " Zone 4 covers non-production areas \u2014 furthest from the product, but still part of a complete environmental monitoring program."}, {"question": "Why do many EMPs sample \u201coutside-in\u201d (Zones 2\u20134 closely, working toward Zone 1)?", "options": ["To catch Listeria before it has a chance to reach the product in Zone 1", "Because Zone 1 doesn't need to be tested", "Because outside areas are more heavily regulated", "To reduce the total number of samples taken"], "correctIndex": 0, "explanation": " Watching Zones 2 through 4 closely is about early detection \u2014 catching a problem while it's still outside the product zone, before it can reach Zone 1."}, {"question": "What kind of surfaces does Zone 2 cover?", "options": ["Non-food-contact surfaces immediately adjacent to product, like equipment housings and frames", "Direct food-contact surfaces only", "Only the plant parking lot", "Only employee break rooms"], "correctIndex": 0, "explanation": " Zone 2 is non-food-contact, but close \u2014 equipment housings, frames, and supports right next to where product moves through."}]}, {"title": "When a Swab Comes Back Positive", "points": ["A positive environmental result triggers a root-cause investigation, not panic \u2014 the goal is finding where the organism came from and fixing it.", "Sampling intensity increases around a positive site until the plant confirms multiple consecutive negative results \u2014 one clean swab isn't enough to call it resolved.", "A positive on a food-contact surface (Zone 1) is treated far more seriously than a Zone 3 or 4 positive, since Zone 1 has direct access to the product."], "kcs": [{"question": "What happens after an environmental swab comes back positive?", "options": ["A root-cause investigation, with increased sampling until consecutive negatives are confirmed", "Nothing, unless it happens three times in a row", "The plant shuts down immediately, no investigation needed", "The result is noted but no action is required"], "correctIndex": 0, "explanation": " A positive triggers a root-cause investigation and increased sampling around that site \u2014 the plant needs multiple consecutive negative results before considering it resolved."}, {"question": "Why is a Zone 1 positive treated more seriously than a Zone 3 or 4 positive?", "options": ["Zone 1 has direct access to the product", "Zone 1 is the easiest zone to clean", "Zone 1 positives are actually less common", "There's no difference in how zones are treated"], "correctIndex": 0, "explanation": " Zone 1 is direct food-contact \u2014 a positive there means the organism has direct access to the product, which is far more serious than a positive further from the product in Zone 3 or 4."}]}], "assessmentBank": [{"question": "Why does RTE product need stricter environmental control than raw product?", "options": ["There's no kill step after packaging, so contamination reaches the consumer directly", "RTE product is inspected more often", "RTE product needs no inspection at all", "Raw product carries more risk, so RTE needs less control"], "correctIndex": 0}, {"question": "Why is Listeria monocytogenes specifically an adulterant in RTE product?", "options": ["It's the pathogen most linked to contamination picked up in the plant environment after the kill step", "It's the only pathogen that can survive cooking", "It only affects raw product", "It isn't actually a concern in RTE facilities"], "correctIndex": 0}, {"question": "What makes Listeria monocytogenes uniquely hard to control in a refrigerated environment?", "options": ["It keeps growing at refrigeration temperatures, unlike most pathogens", "It can't survive outside the human body", "Refrigeration destroys it quickly", "It only grows above room temperature"], "correctIndex": 0}, {"question": "How long can Listeria monocytogenes persist in a facility once established?", "options": ["Months or years, if not found and eliminated", "A single production shift at most", "It dies off within a day or two", "It can't survive on equipment surfaces"], "correctIndex": 0}, {"question": "Which zone covers direct food-contact surfaces?", "options": ["Zone 1", "Zone 2", "Zone 3", "Zone 4"], "correctIndex": 0}, {"question": "Which zone covers non-production areas like hallways and loading docks?", "options": ["Zone 4", "Zone 1", "Zone 2", "Zone 3"], "correctIndex": 0}, {"question": "What does Zone 2 typically cover?", "options": ["Non-food-contact surfaces immediately adjacent to product", "Direct food-contact surfaces", "Break rooms only", "The plant parking lot"], "correctIndex": 0}, {"question": "Why sample Zones 2 through 4 closely in an \u201coutside-in\u201d strategy?", "options": ["To catch contamination before it can reach the product in Zone 1", "Because Zone 1 doesn't need testing", "Because outer zones are more heavily regulated", "To reduce the total number of samples"], "correctIndex": 0}, {"question": "What happens after an environmental swab comes back positive?", "options": ["A root-cause investigation, with increased sampling until consecutive negatives are confirmed", "Nothing, unless it repeats three times", "Immediate plant shutdown with no investigation", "The result is noted with no required action"], "correctIndex": 0}, {"question": "Why is a Zone 1 positive treated more seriously than a Zone 3 or 4 positive?", "options": ["Zone 1 has direct access to the product", "Zone 1 is the easiest zone to clean", "Zone 1 positives are less common", "All zones are treated identically"], "correctIndex": 0}]}
// ---------- utilities ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(q){
  const idx = shuffle(q.options.map((_,i)=>i));
  return { question:q.question, options: idx.map(i=>q.options[i]), correctIndex: idx.indexOf(q.correctIndex), explanation:q.explanation || '' };
}
function prepareBank(bank, sampleSize){
  // Draws `sampleSize` questions at random from the pool (independently for pre/post),
  // so a pool larger than the sample size yields genuinely different pre- vs post-assessments,
  // not just a reshuffled copy of the same questions.
  const n = sampleSize || bank.length;
  const order = shuffle(bank.map((_,i)=>i)).slice(0, Math.min(n, bank.length));
  return order.map(i => shuffleOptions(bank[i]));
}

const ASSESSMENT_SAMPLE_SIZE = 10;
// shuffle each module's KC options once at load
COURSE.modules.forEach(m => { m.kcs = m.kcs.map(shuffleOptions); });
const PRE_BANK = prepareBank(COURSE.assessmentBank, ASSESSMENT_SAMPLE_SIZE);
const POST_BANK = prepareBank(COURSE.assessmentBank, ASSESSMENT_SAMPLE_SIZE);
const pretestAnswers = new Array(PRE_BANK.length).fill(null);
const posttestAnswers = new Array(POST_BANK.length).fill(null);
const kcState = {}; // "mi-ki" -> {selected, submitted, correctFirstTry}

// ---------- slide sequence ----------
function buildSlides(course){
  const slides = [{type:'landing'}];
  slides.push({type:'pretestIntro'});
  for(let i=0;i<PRE_BANK.length;i++) slides.push({type:'pretest', qIndex:i});
  slides.push({type:'pretestResult'});
  course.modules.forEach((m, mi) => {
    slides.push({type:'content', moduleIndex:mi});
    m.kcs.forEach((_, ki) => slides.push({type:'kc', moduleIndex:mi, kcIndex:ki}));
  });
  slides.push({type:'posttestIntro'});
  for(let i=0;i<POST_BANK.length;i++) slides.push({type:'posttest', qIndex:i});
  slides.push({type:'summary'});
  slides.push({type:'survey'});
  return slides;
}
const SLIDES = buildSlides(COURSE);

const surveyState = { overall:null, clear:null, confident:null, goodUse:null, suggestions:'', submitted:false };

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function goTo(idx){
  current = Math.max(0, Math.min(SLIDES.length-1, idx));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  renderHeader(app);
  const card = el('div','card');
  const slide = SLIDES[current];
  if(slide.type === 'landing') renderLanding(card);
  else if(slide.type === 'pretestIntro') renderAssessIntro(card, 'pretest');
  else if(slide.type === 'pretest') renderAssessQuestion(card, 'pretest', slide.qIndex);
  else if(slide.type === 'pretestResult') renderPretestResult(card);
  else if(slide.type === 'content') renderContent(card, slide.moduleIndex);
  else if(slide.type === 'kc') renderKC(card, slide.moduleIndex, slide.kcIndex);
  else if(slide.type === 'posttestIntro') renderAssessIntro(card, 'posttest');
  else if(slide.type === 'posttest') renderAssessQuestion(card, 'posttest', slide.qIndex);
  else if(slide.type === 'summary') renderSummary(card);
  else if(slide.type === 'survey') renderSurvey(card);
  app.appendChild(card);
}

function footer(showBack, nextLabel, onNext, onBack, nextDisabled){
  const wrap = el('div','card-footer');
  const back = el('button','btn btn-ghost sans','\u2190 Back');
  if(showBack){ back.addEventListener('click', onBack || (()=>goTo(current-1))); }
  else { back.disabled = true; }
  wrap.appendChild(back);
  const next = el('button','btn btn-primary sans', nextLabel);
  if(nextDisabled) next.disabled = true;
  next.addEventListener('click', onNext);
  wrap.appendChild(next);
  return wrap;
}

// ---------- LANDING ----------
function renderLanding(card){
  if(COURSE.heroSvg){
    const fig = el('div','hero-fig', COURSE.heroSvg);
    card.appendChild(fig);
  } else {
    card.appendChild(el('div','landing-icon', '\u{1F393}'));
  }
  card.appendChild(el('div','kicker', COURSE.college));
  card.appendChild(el('h1','slide-title', COURSE.courseTitle));
  const body = el('div','body-text');
  body.appendChild(el('p', null, COURSE.description));
  card.appendChild(body);

  const meta = el('div','meta-row');
  const metaData = [
    ['Course Number', COURSE.courseCode],
    ['Employee Type', COURSE.employeeType],
    ['Format', COURSE.format],
    ['Prerequisites', COURSE.prerequisites],
    ['Estimated Duration', COURSE.estDuration]
  ];
  metaData.forEach(([label,val])=>{
    const item = el('div','meta-item');
    item.appendChild(el('div','meta-label', label.toUpperCase()));
    item.appendChild(el('div','meta-value', val));
    meta.appendChild(item);
  });
  card.appendChild(meta);

  card.appendChild(el('div','assess-note', '\u{1F4CB} This course includes a ' + PRE_BANK.length + '-question pre-assessment, ' + totalKCCount() + ' embedded knowledge checks, and a ' + POST_BANK.length + '-question post-assessment covering the same material, shuffled.'));

  const objWrap = el('div');
  objWrap.appendChild(el('div','kicker', 'BY THE END OF THIS COURSE, YOU WILL BE ABLE TO:'));
  const ul = el('ul','obj-list');
  COURSE.objectives.forEach(o => ul.appendChild(el('li', null, o)));
  objWrap.appendChild(ul);
  card.appendChild(objWrap);

  card.appendChild(footer(false, 'Start Course', ()=>goTo(current+1)));
}
function totalKCCount(){
  return COURSE.modules.reduce((n,m)=>n+m.kcs.length,0);
}

// ---------- ASSESSMENT INTRO ----------
function renderAssessIntro(card, phase){
  const isPre = phase === 'pretest';
  card.appendChild(el('div','kicker', isPre ? 'BEFORE WE BEGIN' : 'BEFORE YOU FINISH'));
  card.appendChild(el('h1','slide-title', isPre ? 'Quick pre-assessment' : 'Post-assessment'));
  const body = el('div','body-text');
  body.appendChild(el('p', null, isPre
    ? "10 questions, drawn from everything this course covers. Don't worry about getting them all right — this is just your starting point, and you'll see these ideas again in the modules ahead."
    : "Same 10-question bank as your pre-assessment, shuffled. This measures how much moved since you started — answer based on what you just learned."));
  card.appendChild(body);
  card.appendChild(footer(true, isPre ? 'Begin Pre-Assessment' : 'Begin Post-Assessment', ()=>goTo(current+1)));
}

// ---------- ASSESSMENT QUESTION ----------
function renderAssessQuestion(card, phase, qIndex){
  const isPre = phase === 'pretest';
  const bank = isPre ? PRE_BANK : POST_BANK;
  const answers = isPre ? pretestAnswers : posttestAnswers;
  const q = bank[qIndex];

  card.appendChild(el('div','kc-badge sans', (isPre ? 'PRE-ASSESSMENT' : 'POST-ASSESSMENT') + ' \u2022 QUESTION ' + (qIndex+1) + ' OF ' + bank.length));
  card.appendChild(el('div','kc-question', q.question));

  const optWrap = el('div','options');
  q.options.forEach((opt, oi) => {
    const btn = el('button','option sans');
    btn.type = 'button';
    const letter = el('span','letter', String.fromCharCode(65+oi));
    btn.appendChild(letter);
    btn.appendChild(el('span', null, opt));
    if(answers[qIndex] === oi) btn.classList.add('selected');
    btn.addEventListener('click', ()=>{ answers[qIndex] = oi; render(); });
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);

  const isLast = qIndex === bank.length - 1;
  const nextLabel = isLast ? (isPre ? 'Finish Pre-Assessment \u2192' : 'Finish Post-Assessment \u2192') : 'Next \u2192';
  card.appendChild(footer(true, nextLabel, ()=>goTo(current+1), ()=>goTo(current-1), answers[qIndex] === null));
}

function renderPretestResult(card){
  const score = pretestAnswers.reduce((n,a,i)=> n + (a === PRE_BANK[i].correctIndex ? 1 : 0), 0);
  card.appendChild(el('div','kicker', 'BASELINE RECORDED'));
  card.appendChild(el('h1','slide-title', 'Pre-assessment complete'));
  const scoreBox = el('div','score-box');
  const s1 = el('div');
  s1.appendChild(el('div','score-num', score + '/' + PRE_BANK.length));
  s1.appendChild(el('div','score-label sans','Pre-assessment score'));
  scoreBox.appendChild(s1);
  card.appendChild(scoreBox);
  const body = el('div','body-text');
  body.appendChild(el('p', null, "This is just your starting point — let's build from here. You'll see a post-assessment at the end so you and your trainer can see what moved."));
  card.appendChild(body);
  card.appendChild(footer(true, 'Start Module 1 \u2192', ()=>goTo(current+1)));
}

// ---------- CONTENT ----------
function renderContent(card, mi){
  const m = COURSE.modules[mi];
  card.appendChild(el('div','module-tag', 'MODULE ' + (mi+1) + ' OF ' + COURSE.modules.length));
  card.appendChild(el('h2','slide-title', m.title));
  const body = el('div','body-text');
  const ul = el('ul','points');
  m.points.forEach(p => ul.appendChild(el('li', null, p)));
  body.appendChild(ul);
  card.appendChild(body);
  if(m.svg){
    card.appendChild(el('div','module-fig', m.svg));
  }
  if(m.callout){
    card.appendChild(el('div','callout', m.callout));
  }
  card.appendChild(footer(true, 'Continue \u2192', ()=>goTo(current+1), ()=>goTo(current-1)));
}

// ---------- KNOWLEDGE CHECK ----------
function renderKC(card, mi, ki){
  const m = COURSE.modules[mi];
  const kc = m.kcs[ki];
  const key = mi+'-'+ki;
  if(!kcState[key]) kcState[key] = {selected:null, submitted:false, correctFirstTry:null};
  const st = kcState[key];

  const totalKC = totalKCCount();
  const kcNumber = COURSE.modules.slice(0,mi).reduce((n,mm)=>n+mm.kcs.length,0) + ki + 1;

  card.appendChild(el('div','kc-badge sans', '\u2713 KNOWLEDGE CHECK ' + kcNumber + ' OF ' + totalKC));
  card.appendChild(el('div','kc-question', kc.question));

  const optWrap = el('div','options');
  kc.options.forEach((opt, oi) => {
    const btn = el('button','option sans');
    btn.type = 'button';
    const letter = el('span','letter', String.fromCharCode(65+oi));
    btn.appendChild(letter);
    btn.appendChild(el('span', null, opt));
    if(st.submitted){
      btn.disabled = true;
      btn.classList.add('locked');
      if(oi === kc.correctIndex) btn.classList.add('correct');
      else if(oi === st.selected) btn.classList.add('incorrect');
    } else {
      if(st.selected === oi) btn.classList.add('selected');
      btn.addEventListener('click', ()=>{ st.selected = oi; render(); });
    }
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);

  const fb = el('div','feedback');
  if(st.submitted){
    const isCorrect = st.selected === kc.correctIndex;
    fb.classList.add('show', isCorrect ? 'correct-fb' : 'incorrect-fb');
    fb.innerHTML = '<b>'+(isCorrect ? 'Correct.' : 'Not quite.')+'</b>' + kc.explanation;
  }
  card.appendChild(fb);

  const footWrap = el('div','card-footer');
  const back = el('button','btn btn-ghost sans','\u2190 Back');
  back.addEventListener('click', ()=>goTo(current-1));
  footWrap.appendChild(back);

  if(!st.submitted){
    const submit = el('button','btn btn-primary sans','Submit Answer');
    submit.disabled = st.selected === null;
    submit.addEventListener('click', ()=>{
      st.submitted = true;
      if(st.correctFirstTry === null) st.correctFirstTry = (st.selected === kc.correctIndex);
      render();
    });
    footWrap.appendChild(submit);
  } else if(st.selected !== kc.correctIndex){
    const retry = el('button','btn btn-primary sans','Try Again');
    retry.addEventListener('click', ()=>{ st.submitted=false; st.selected=null; render(); });
    footWrap.appendChild(retry);
  } else {
    const cont = el('button','btn btn-primary sans','Continue \u2192');
    cont.addEventListener('click', ()=>goTo(current+1));
    footWrap.appendChild(cont);
  }
  card.appendChild(footWrap);
}

// ---------- SUMMARY ----------
function renderSummary(card){
  const preScore = pretestAnswers.reduce((n,a,i)=> n + (a === PRE_BANK[i].correctIndex ? 1 : 0), 0);
  const postScore = posttestAnswers.reduce((n,a,i)=> n + (a === POST_BANK[i].correctIndex ? 1 : 0), 0);
  const totalKC = totalKCCount();
  let kcCorrect = 0;
  Object.values(kcState).forEach(s => { if(s.correctFirstTry) kcCorrect++; });
  const delta = postScore - preScore;

  card.appendChild(el('div','complete-icon', '\u2713'));
  card.appendChild(el('div','kicker', COURSE.courseCode + ' COMPLETE'));
  card.appendChild(el('h1','slide-title', 'Nice work.'));
  const body = el('div','body-text');
  body.appendChild(el('p', null, "You've completed " + COURSE.courseTitle + ' — pre-assessment, all modules and knowledge checks, and the post-assessment.'));
  card.appendChild(body);

  const scoreBox = el('div','score-box');
  const items = [
    [preScore, PRE_BANK.length, 'Pre-assessment', false],
    [postScore, POST_BANK.length, 'Post-assessment', delta > 0],
    [kcCorrect, totalKC, 'Knowledge checks (first try)', false]
  ];
  items.forEach(([num,total,label,forceGreen])=>{
    const s = el('div');
    const numEl = el('div','score-num', num + '/' + total);
    if((num/total) >= 0.8 || forceGreen){ numEl.style.color = 'var(--green)'; }
    s.appendChild(numEl);
    s.appendChild(el('div','score-label sans', label));
    scoreBox.appendChild(s);
  });
  card.appendChild(scoreBox);

  let deltaMsg;
  if(delta > 0) deltaMsg = 'Congratulations! You improved by ' + delta + ' question' + (delta===1?'':'s') + ' from pre- to post-assessment.';
  else if(delta === 0) deltaMsg = 'You matched your pre-assessment score — solid baseline retention.';
  else deltaMsg = "Your post-assessment score came in lower than your pre-assessment. Worth a second pass through this course before moving on.";
  card.appendChild(el('div','callout', deltaMsg));

  if(COURSE.leadsTo){
    const next = el('div','body-text');
    next.style.marginTop = '18px';
    next.appendChild(el('p', null, '<b>Next up:</b> ' + COURSE.leadsTo));
    card.appendChild(next);
  }

  const footWrap = el('div','card-footer');
  const back = el('button','btn btn-ghost sans','\u2190 Review');
  back.addEventListener('click', ()=>goTo(current-1));
  footWrap.appendChild(back);
  const toSurvey = el('button','btn btn-primary sans','Continue to Feedback Survey \u2192');
  toSurvey.addEventListener('click', ()=>goTo(current+1));
  footWrap.appendChild(toSurvey);
  card.appendChild(footWrap);
}

// ---------- FEEDBACK SURVEY ----------
function ratingRow(question, key, lowLabel, highLabel){
  const wrap = el('div','survey-q');
  wrap.appendChild(el('div','survey-q-text', question));
  const scale = el('div','survey-scale');
  scale.appendChild(el('span','end-label', lowLabel));
  for(let i=1;i<=5;i++){
    const dot = el('button','survey-dot', String(i));
    dot.type = 'button';
    if(surveyState[key] === i) dot.classList.add('selected');
    dot.addEventListener('click', ()=>{ surveyState[key] = i; render(); });
    scale.appendChild(dot);
  }
  scale.appendChild(el('span','end-label right', highLabel));
  wrap.appendChild(scale);
  return wrap;
}

function renderSurvey(card){
  if(surveyState.submitted){
    card.appendChild(el('div','complete-icon', '\u2713'));
    card.appendChild(el('div','kicker', 'FEEDBACK RECEIVED'));
    card.appendChild(el('h1','slide-title', 'Thank you.'));
    const body = el('div','body-text');
    body.appendChild(el('p', null, "Your feedback on " + COURSE.courseTitle + " has been recorded. It helps LEAP University improve this course for the next person who takes it."));
    card.appendChild(body);
    const footWrap = el('div','card-footer');
    const back = el('button','btn btn-ghost sans','\u2190 Back');
    back.addEventListener('click', ()=>{ surveyState.submitted = false; render(); });
    footWrap.appendChild(back);
    const restart = el('button','btn btn-primary sans','Restart Course');
    restart.addEventListener('click', ()=>{
      Object.keys(kcState).forEach(k=>delete kcState[k]);
      for(let i=0;i<pretestAnswers.length;i++) pretestAnswers[i]=null;
      for(let i=0;i<posttestAnswers.length;i++) posttestAnswers[i]=null;
      surveyState.overall = null; surveyState.clear = null; surveyState.confident = null;
      surveyState.goodUse = null; surveyState.suggestions = ''; surveyState.submitted = false;
      goTo(0);
    });
    footWrap.appendChild(restart);
    card.appendChild(footWrap);
    return;
  }

  card.appendChild(el('div','kicker', 'LAST STEP'));
  card.appendChild(el('h1','slide-title', 'Course Feedback Survey'));

  const table = document.createElement('table');
  table.className = 'survey-meta';
  const rows = [
    ['Course / Session Completed', COURSE.courseCode + ' — ' + COURSE.courseTitle],
    ['College', COURSE.college],
    ['Employee Type', COURSE.employeeType],
    ['Date', new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })]
  ];
  rows.forEach(([label,val])=>{
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.className='label'; td1.textContent = label;
    const td2 = document.createElement('td'); td2.className='value'; td2.textContent = val;
    tr.appendChild(td1); tr.appendChild(td2);
    table.appendChild(tr);
  });
  card.appendChild(table);

  card.appendChild(ratingRow('1. Overall, how would you rate this training?', 'overall', 'Poor', 'Excellent'));
  card.appendChild(ratingRow('2. The training content was clear and easy to understand.', 'clear', 'Strongly Disagree', 'Strongly Agree'));
  card.appendChild(ratingRow('3. I feel confident applying what I learned to my job.', 'confident', 'Strongly Disagree', 'Strongly Agree'));
  card.appendChild(ratingRow('4. This training was a good use of my time.', 'goodUse', 'Strongly Disagree', 'Strongly Agree'));

  const q5 = el('div','survey-q');
  q5.appendChild(el('div','survey-q-text', '5. What suggestions do you have to improve this course?'));
  const textarea = document.createElement('textarea');
  textarea.className = 'survey-textarea';
  textarea.placeholder = 'Optional — share any thoughts here.';
  textarea.value = surveyState.suggestions;
  textarea.addEventListener('input', (e)=>{ surveyState.suggestions = e.target.value; });
  q5.appendChild(textarea);
  card.appendChild(q5);

  const allRated = surveyState.overall && surveyState.clear && surveyState.confident && surveyState.goodUse;
  const footWrap = el('div','card-footer');
  const back = el('button','btn btn-ghost sans','\u2190 Back');
  back.addEventListener('click', ()=>goTo(current-1));
  footWrap.appendChild(back);
  const submit = el('button','btn btn-primary sans','Submit Feedback');
  submit.disabled = !allRated;
  submit.addEventListener('click', ()=>{ surveyState.submitted = true; render(); });
  footWrap.appendChild(submit);
  card.appendChild(footWrap);
}

render();
</script>
</body>
</html>
